# Harmonisation par histogram matching vers un centre de référence : baseline de prétraitement,
# déterministe (p = 1), à appliquer aussi à la validation et au test.
transforms:
  - name: histogram_matching
    p: 1.0
    # Centre d'entraînement le plus proche du reste du pool (calibration.json) ; R009 avant splits.json.
    reference_sites: [R059]
    # build_transforms(config, fold=k) : référence du pli k, choisie hors de ses centres de validation.
    fold_reference_sites: [R059, R071, R059, R004, R071]
    source: processed         # références prises dans les données prétraitées C1 (data/processed)
    splits: splits.json       # refuse un centre de test ; références prises parmi les sujets d'entraînement
    n_references: 20          # sujets moyennés pour l'histogramme de référence
    # reference_file: generalization/artifacts/histref.pt   # cache local (ignoré par Git), suffixe _pliK par pli
