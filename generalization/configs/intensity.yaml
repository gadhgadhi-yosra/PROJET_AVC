# Augmentation d'intensité (§3.5 a).
# Chaque transformation a une probabilité `p` et ses plages [min, max] ; `enabled: false` la désactive.
# Plages calibrées sur exploration/outputs/site_summary.csv, TOUS centres confondus : à recalculer
# sur les seuls centres d'entraînement dès que splits.json est fixé (voir README).
transforms:
  - name: gamma
    p: 0.3
    gamma: [0.7, 1.85]        # position de la médiane sur [0, p99] : 0,40 à 0,70 selon le centre

  - name: contrast
    p: 0.3
    factor: [0.78, 1.56]      # coefficient de variation 0,32 à 0,64, rapporté à sa médiane 0,41

  - name: noise
    p: 0.2
    std: [0.0, 0.1]           # fraction de l'écart-type du cerveau (non calibré : pas de mesure du bruit)

  - name: blur
    p: 0.2
    sigma_mm: [0.25, 1.0]

  - name: bias_field
    p: 0.3
    coefficients: 0.2         # log du champ ; donne environ 0,82 à 1,26 dans le cerveau (non calibré)
    order: 3

  - name: low_resolution
    p: 0.25
    isotropic_mm: [1.0, 1.5]  # R050 : 1,3 mm ; R049 : 1,5 mm isotrope
    axis_mm: [1.0, 3.0]       # coupes épaisses sur un seul axe (jusqu'à 3 mm)
    axis_probability: 0.5
