# Augmentation d'intensité (§3.5 a).
# Chaque transformation a une probabilité `p` et ses plages [min, max] ; `enabled: false` la désactive.
# Gamma et contraste calibrés sur les seuls sujets d'entraînement de splits.json
# (python -m generalization.calibration -> calibration.json ; voir README).
transforms:
  - name: gamma
    p: 0.3
    gamma: [0.71, 1.77]       # position de la médiane sur [0, p99] : 0,41 (R030) à 0,69 (R014), médiane 0,601

  - name: contrast
    p: 0.3
    factor: [0.78, 1.52]      # coefficient de variation 0,32 (R020) à 0,62 (R030), rapporté à sa médiane 0,409

  - name: noise
    p: 0.2
    std: [0.0, 0.1]           # fraction de l'écart-type du cerveau (non calibré : pas de mesure du bruit)

  - name: blur
    p: 0.2
    sigma_mm: [0.25, 1.0]

  - name: bias_field
    p: 0.3
    coefficients: 0.2         # log du champ ; donne environ 0,82 à 1,26 dans le cerveau (non calibré)
    order: 3

  - name: low_resolution
    p: 0.25
    isotropic_mm: [1.0, 1.5]  # R050 : 1,3 mm ; R049 : 1,5 mm isotrope
    axis_mm: [1.0, 3.0]       # coupes épaisses sur un seul axe (jusqu'à 3 mm)
    axis_probability: 0.5
