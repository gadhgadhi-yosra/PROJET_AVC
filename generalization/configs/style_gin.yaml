# Randomisation du style par GIN (Ouyang et al., IEEE TMI 2022).
transforms:
  - name: gin
    p: 0.5
    n_layers: 4
    channels: 2
    kernel_sizes: [1, 3]
    mix: [0.0, 0.5]           # poids de l'image stylisée ; [0, 1] dans l'article, plafonné pour garder la lésion visible
    allow_inversion: false    # true = comportement de l'article (le contraste peut s'inverser)
