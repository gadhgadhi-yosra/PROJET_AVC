# FDA, Fourier Domain Adaptation (Yang & Soatto, CVPR 2020) : l'amplitude basse fréquence est
# échangée avec celle d'une image d'un autre centre, la phase est conservée.
transforms:
  - name: fda
    p: 0.5
    # Demi-côté du cube échangé = beta x plus petit côté ; 0 = identité. Plage réglée sur données réelles
    # (visual_check --fda-betas) : sous 0,015 l'effet est négligeable ; au-delà de 0,05 certaines lésions
    # perdent plus de la moitié de leur contraste.
    beta: [0.015, 0.03]
    # Centre d'entraînement le plus proche du reste du pool (calibration.json) ; R009 avant splits.json.
    reference_sites: [R059]
    # build_transforms(config, fold=k) : référence du pli k, choisie hors de ses centres de validation.
    fold_reference_sites: [R059, R071, R059, R004, R071]
    source: processed         # références prises dans les données prétraitées C1 (data/processed)
    splits: splits.json       # refuse un centre de test ; références prises parmi les sujets d'entraînement
    n_references: 8           # images de référence gardées en mémoire par processus
